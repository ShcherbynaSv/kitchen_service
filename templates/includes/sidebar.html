      <form action="{% url 'logout' %}" method="post">

  <li class="list-group-item"><a href="{% url 'kitchen:index' %}">Home</a></li>

  <li class="list-group-item"><a href="{% url 'kitchen:ingredient-list' %}">All ingredients</a></li>

</ul>
