{% extends "base.html" %}

{% block content %}
  <h1>Cooks<a style="float: right;" class="btn btn-primary" href="{% url 'kitchen:cook-create' %}"><b>+</b></a></h1>
  {% if cook_list %}
    <ul>
      {% for cook in cook_list %}
        <li>
          <a href="{{ cook.get_absolute_url }}">{{ cook.first_name }} {{ cook.last_name }}</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cooks</p>
  {% endif %}
  {% endblock %}
